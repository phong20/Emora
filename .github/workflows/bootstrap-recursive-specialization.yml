name: Bootstrap recursive specialization

on:
  push:
    branches:
      - agent/recursive-specialization-tco-guard

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "ECMORA_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"

      - name: Apply recursive lowering patch
        run: python3 tools/bootstrap_recursive_specialization.py

      - name: Format and validate sources
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          git diff --check
          clang-22 -std=c11 -Wall -Wextra -Werror -fsyntax-only crates/ecmora-runtime/native/object_runtime.c
          cargo check -p ecmora-ir -p ecmora-analysis
          cargo check -p ecmora-codegen-llvm -p ecmora-driver -p ecmora-cli

      - name: Validate SSA and LLVM lowering
        shell: bash
        run: |
          set -euxo pipefail
          for test in \
            tests/recursive-contextual-return-native.js \
            tests/recursive-polymorphic-specialization-native.js \
            tests/recursive-callback-specialization-native.js \
            tests/recursive-stack-guard-native.js
          do
            cargo run -p ecmora-cli -- check "$test"
            cargo run -p ecmora-cli -- dump-llvm "$test"
          done
          grep -R "tail_call" target/ecmora/*.ssa.txt 2>/dev/null || true

      - name: Build and execute success fixtures
        shell: bash
        run: |
          set -euxo pipefail
          run_case() {
            local source="$1"
            local expected="$2"
            local stem
            stem="$(basename "$source" .js)"
            cargo run -p ecmora-cli -- build "$source" 2>"target/${stem}.build.stderr"
            ! grep -q "compatibility executable" "target/${stem}.build.stderr"
            local actual
            actual="$("./target/ecmora/${stem}")"
            test "$actual" = "$expected"
          }
          run_case tests/recursive-contextual-return-native.js 42
          run_case tests/recursive-polymorphic-specialization-native.js 7
          run_case tests/recursive-callback-specialization-native.js 200000

      - name: Validate recursion guard
        shell: bash
        run: |
          set -euxo pipefail
          source=tests/recursive-stack-guard-native.js
          stem=recursive-stack-guard-native
          cargo run -p ecmora-cli -- build "$source" 2>"target/${stem}.build.stderr"
          ! grep -q "compatibility executable" "target/${stem}.build.stderr"
          set +e
          "./target/ecmora/${stem}" >"target/${stem}.stdout" 2>"target/${stem}.stderr"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Ecmora RangeError: maximum native recursion depth" "target/${stem}.stderr"

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/bootstrap_recursive_specialization.py
          rm -f .github/workflows/bootstrap-recursive-specialization.yml
          git config user.name "openai-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support recursive specializations and native tail calls"
          git push origin HEAD:agent/recursive-specialization-tco-guard
